<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Gradiente per il portale -->
    <radialGradient id="portalGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#6c3483;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a235a;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradiente per il bordo magico -->
    <linearGradient id="magicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#d35400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1c40f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtro per effetto glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Filtro per scintillio -->
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cerchio esterno del portale -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#magicBorder)" stroke-width="8" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" from="0 1000" to="1000 1000" dur="2s" fill="freeze" />
  </circle>
  
  <!-- Anello magico rotante -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#9b59b6" stroke-width="4" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="10s" repeatCount="indefinite" />
  </circle>
  
  <!-- Secondo anello rotante in direzione opposta -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#8e44ad" stroke-width="3" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <!-- Terzo anello -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#a569bd" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="12s" repeatCount="indefinite" />
  </circle>
  
  <!-- Nucleo del portale -->
  <circle cx="200" cy="200" r="100" fill="url(#portalGradient)" filter="url(#glow)">
    <animate attributeName="r" values="100;105;100" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Vortice interno -->
  <path d="M 200 100 Q 250 150 200 200 Q 150 250 200 300 Q 250 250 200 200 Q 150 150 200 100" 
        fill="none" stroke="#c39bd7" stroke-width="2" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="6s" repeatCount="indefinite" />
  </path>
  
  <!-- Particelle magiche -->
  <g filter="url(#sparkle)">
    <circle cx="200" cy="80" r="3" fill="#f1c40f">
      <animate attributeName="cy" values="80;120;80" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="260" cy="140" r="2" fill="#f39c12">
      <animate attributeName="cy" values="140;180;140" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="160" r="2.5" fill="#e67e22">
      <animate attributeName="cy" values="160;200;160" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="240" r="2" fill="#f1c40f">
      <animate attributeName="cy" values="240;280;240" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="260" r="3" fill="#f39c12">
      <animate attributeName="cy" values="260;300;260" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Simboli runici intorno al portale -->
  <g fill="#f1c40f" opacity="0.8">
    <path d="M 200 30 L 205 40 L 200 45 L 195 40 Z">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 370 200 L 360 205 L 355 200 L 360 195 Z">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.7s" repeatCount="indefinite" />
    </path>
    <path d="M 200 370 L 195 360 L 200 355 L 205 360 Z">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.9s" repeatCount="indefinite" />
    </path>
    <path d="M 30 200 L 40 195 L 45 200 L 40 205 Z">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.1s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
