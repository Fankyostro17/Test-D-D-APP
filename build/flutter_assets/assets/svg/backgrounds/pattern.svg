<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <pattern id="fantasy-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <!-- Motivo geometrico fantasy -->
    <path d="M10 0 L20 10 L10 20 L0 10 Z" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <circle cx="10" cy="10" r="3" fill="none" stroke="#D4AF37" stroke-width="0.3"/>
    <path d="M10 2 L18 10 L10 18 L2 10 Z" fill="none" stroke="#D4AF37" stroke-width="0.2"/>
  </pattern>
  
  <!-- Sfondo con pattern -->
  <rect width="100" height="100" fill="url(#fantasy-pattern)"/>
  
  <!-- Elementi decorativi angolari -->
  <path d="M0 0 L15 0 L15 5 L5 5 L5 15 L0 15 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
  <path d="M100 0 L85 0 L85 5 L95 5 L95 15 L100 15 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
  <path d="M0 100 L15 100 L15 95 L5 95 L5 85 L0 85 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
  <path d="M100 100 L85 100 L85 95 L95 95 L95 85 L100 85 Z" fill="none" stroke="#D4AF37" stroke-width="1"/>
  
  <!-- Motivo centrale decorativo -->
  <g transform="translate(50, 50)">
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="none" stroke="#D4AF37" stroke-width="0.3"/>
    <circle cx="0" cy="0" r="3" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
  </g>
</svg>
