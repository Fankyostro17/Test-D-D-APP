name: ttrpg_companion
description: "A cross-platform TTRPG companion app for D&D and other tabletop RPGs with SVG-based UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  uuid: ^4.5.3
  
  # SVG rendering
  flutter_svg: ^2.0.9
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Dice rolling
  random_string: ^2.3.1
  
  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/svg/
    - assets/svg/dice/
    - assets/svg/icons/
    - assets/svg/backgrounds/
    
  #fonts:
    #- family: GameFont
      #fonts:
        #- asset: assets/fonts/game_font.ttf
